<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="NFL analytics built on nflverse play-by-play: EPA, success rate, luck, and which stats are signal vs noise."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			try {
				const t = localStorage.getItem('ags-theme');
				if (t) document.documentElement.dataset.theme = t;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
