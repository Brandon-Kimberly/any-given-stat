<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Link previews: the placeholders below are filled per route at build (src/hooks.server.ts). -->
		<meta name="description" content="__OG_DESCRIPTION__" />
		<meta name="theme-color" content="#1c5cab" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Any Given Stat" />
		<meta property="og:title" content="__OG_TITLE__" />
		<meta property="og:description" content="__OG_DESCRIPTION__" />
		<meta property="og:url" content="__OG_URL__" />
		<meta property="og:image" content="__OG_IMAGE__" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Any Given Stat: Know which numbers matter. NFL power ratings, win probability, playoff odds and forecasts graded against Vegas."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="__OG_TITLE__" />
		<meta name="twitter:description" content="__OG_DESCRIPTION__" />
		<meta name="twitter:image" content="__OG_IMAGE__" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<script>
			try {
				const t = localStorage.getItem('ags-theme');
				if (t) document.documentElement.dataset.theme = t;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
