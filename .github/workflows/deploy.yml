name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # In season (September-February): daily after nflverse's nightly play-by-play update,
    # plus Friday evening for final injury statuses and Monday/Tuesday early morning for
    # Sunday and Monday night results. Times are UTC.
    - cron: '17 10 * 9-12,1-2 *'
    - cron: '47 23 * 9-12,1-2 5'
    - cron: '47 7 * 9-12,1-2 1,2'
    # News and injury reports between those: every 6 hours in season (public repos run free).
    - cron: '23 4,16,22 * 9-12,1-2 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Past seasons rarely change; cache downloads and always refresh the latest season.
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/cache
          key: pbp-raw-${{ github.run_id }}
          restore-keys: pbp-raw-

      - name: Build datasets
        working-directory: pipeline
        run: |
          uv sync
          uv run ags build

      - name: Build site
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # Public build: no local /api server (Sync, live news, ESPN proxy). src/lib/hosted.ts
          PUBLIC_HOSTED: '1'
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
