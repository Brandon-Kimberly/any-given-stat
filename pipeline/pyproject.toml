[project]
name = "ags"
version = "0.1.0"
description = "any-given-stat data pipeline: nflverse play-by-play -> static datasets"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ags = "ags.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ags"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
