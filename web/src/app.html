<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="NFL analytics built on every play since 2016: opponent-adjusted power ratings, predictions vs Vegas, win probability game charts, fourth-down decisions, and which stats are signal vs noise."
		/>
		<meta name="theme-color" content="#0f2a4f" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Any Given Stat" />
		<meta property="og:title" content="Any Given Stat: NFL analytics" />
		<meta
			property="og:description"
			content="Power ratings, predictions vs Vegas, win probability charts, fourth-down decisions and which football stats are signal vs noise."
		/>
		<meta property="og:image" content="%sveltekit.assets%/og.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
		/>
		<script>
			try {
				const t = localStorage.getItem('ags-theme');
				if (t) document.documentElement.dataset.theme = t;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
